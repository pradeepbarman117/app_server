openapi: 3.0.0
info:
  title: User API Documentation
  description: API endpoints for managing User operations
  version: 1.0.0

tags:
  - name: User
    description: Endpoints related to User operations

paths:
  /api/user/auth/login:
    post:
      tags:
        - User
      summary: Login as a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Invalid request body
        401:
          description: Invalid credentials

  /api/user/create:
    post:
      tags:
        - User
      summary: Create a new user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Invalid request body
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

  /api/user/get:
    get:
      tags:
        - User
      summary: Get all users
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

  /api/user/get/total:
    get:
      tags:
        - User
      summary: Get total number of users
      security:
        - bearerAuth: []
      responses:
        200:
          description: Total number of users
          content:
            application/json:
              schema:
                type: integer
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

  /api/master/user/all:
    get:
      tags:
        - User
      summary: Get all users created by a master
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users created by a master
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

  /api/master/user/{id}:
    get:
      tags:
        - User
      summary: Get a user created by a master by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        200:
          description: User found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Invalid request
        401:
          description: Authentication failed
        403:
          description: Unauthorized access
        404:
          description: User not found

  /api/admin/user:
    get:
      tags:
        - User
      summary: Get all users created by an admin
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users created by an admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      properties:
        userId:
          type: string
        password:
          type: string
      required:
        - userId
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        password:
          type: string
        passcode:
          type: string
        masterId:
          type: integer
        adminId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time