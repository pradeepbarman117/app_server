openapi: 3.0.0
info:
  title: Master API Documentation
  description: API endpoints for managing Master operations
  version: 1.0.0

tags:
  - name: Master
    description: Endpoints related to Master operations

paths:
  /api/auth/master/login:
    post:
      tags:
        - Master
      summary: Login as a master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        200:
          description: Master logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        400:
          description: Invalid request body
        401:
          description: Invalid credentials

  /api/master/create:
    post:
      tags:
        - Master
      summary: Create a new master
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Master'
      responses:
        201:
          description: Master created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
        400:
          description: Invalid request body
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

  /api/master/get:
    get:
      tags:
        - Master
      summary: Get all masters
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all masters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Master'
        403:
          description: Unauthorized access
        401:
          description: Authentication failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/Master'

    Master:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the master
        name:
          type: string
          description: Name of the master
        email:
          type: string
          description: Email address of the master
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
